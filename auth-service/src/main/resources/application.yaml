spring:
  jpa:
    hibernate:
      ddl-auto: validate
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/auth_db
    username: ${POSTGRES_USER:bus_admin}
    password: ${POSTGRES_PASSWORD:tactical02}

app:
  jwt:
    secret: ${JWT_SECRET}

  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: basic
            connectTimeout: 2000
            readTimeout: 3000


server:
  port: 8083

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/