spring:
  jpa:
    hibernate:
      ddl-auto: validate
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/trip_db
    username: ${POSTGRES_USER:bus_admin}
    password: ${POSTGRES_PASSWORD:tactical02}


  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: basic
            connectTimeout: 2000
            readTimeout: 3000
logging:
  level:
    bus.trip.service.clients: DEBUG

server:
  port: 8082

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/