spring:
  jpa:
    hibernate:
      ddl-auto: validate
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/trip_db
    username: ${POSTGRES_USER:bus_admin}
    password: ${POSTGRES_PASSWORD:tactical02}

